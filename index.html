<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Lluvia de Amor</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:black;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:Arial, sans-serif;
}

/* ===== LLUVIA ===== */
.heart{
    position:absolute;
    top:-30px; /* Siempre inicia arriba */
    color:red;
    font-size:24px;
    animation:fall linear forwards;
    pointer-events:none; /* Para que no interfiera con la carta */
}

@keyframes fall{
    from{
        transform:translateY(0);
    }
    to{
        transform:translateY(110vh);
    }
}

/* ===== CARTA ===== */
.carta{
    width:320px;
    height:220px;
    background:white;
    border-radius:15px;
    position:relative;
    cursor:pointer;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:20px;
    z-index:10;
    transition:0.5s;
}

.mensaje{
    opacity:0;
    transform:scale(0);
    transition:0.5s;
}

.carta.abierta{
    background:pink;
}

.carta.abierta .mensaje{
    opacity:1;
    transform:scale(1);
}
</style>
</head>

<body>

<div class="carta" onclick="abrirCarta(this)">
    <div class="mensaje">
        💌 Feliz San Valentín 💌 <br><br>
       Eres la mejor persona que llego a mi vida💖<br>
        ❤️
    </div>
</div>

<script>

function createHeart(){
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "❤️";

    heart.style.left = Math.random()*100 + "vw";
    heart.style.animationDuration = (Math.random()*3+2)+"s";

    document.body.appendChild(heart);

    setTimeout(()=>{
        heart.remove();
    },5000);
}

setInterval(createHeart,200);

function abrirCarta(el){
    el.classList.toggle("abierta");
}

</script>

</body>
</html>
